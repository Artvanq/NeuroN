name: deploy

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_backend/neuron_backend/package-lock.json

      - name: Backend tests
        working-directory: neuron_backend/neuron_backend
        run: |
          npm ci
          npx prisma generate
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_frontend/package-lock.json

      - name: Frontend build
        working-directory: neuron_frontend
        run: |
          npm ci
          npm run build

      - name: E2E smoke
        working-directory: neuron_frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true

  migrate:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neuron
          POSTGRES_PASSWORD: neuron
          POSTGRES_DB: neuron
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neuron -d neuron"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: neuron_backend/neuron_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_backend/neuron_backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://neuron:neuron@localhost:5433/neuron
        run: npm run db:migrate:deploy

  load-smoke:
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: neuron_backend/neuron_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:load

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, migrate, load-smoke]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: |
          echo "Coolify/VPS: push image or git deploy, then npm run verify:deploy -- https://api.yourdomain.com"
          echo "Budget compose: ./scripts/deploy-vps.sh (see docs/BUDGET-DEPLOY.md)."
          if [ -n "${{ secrets.DEPLOY_API_URL }}" ]; then
            chmod +x scripts/verify-deploy.sh
            ./scripts/verify-deploy.sh "${{ secrets.DEPLOY_API_URL }}"
          fi
          if [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "RAILWAY_TOKEN is set — add railway up per service when ready."
          fi
