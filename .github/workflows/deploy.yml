name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_backend/neuron_backend/package-lock.json

      - name: Backend build (prisma client)
        working-directory: neuron_backend/neuron_backend
        run: |
          npm ci
          npx prisma generate

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_frontend/package-lock.json

      - name: Frontend build
        working-directory: neuron_frontend
        run: |
          npm ci
          npm run build

  migrate:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neuron
          POSTGRES_PASSWORD: neuron
          POSTGRES_DB: neuron
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neuron -d neuron"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: neuron_backend/neuron_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_backend/neuron_backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://neuron:neuron@localhost:5433/neuron
        run: npm run db:migrate:deploy

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, migrate]
    # Auto-deploy on push to main and on version tags; manual run always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main'
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DEPLOY_WAIT_SECONDS: ${{ vars.DEPLOY_WAIT_SECONDS || '60' }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Coolify redeploy
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          echo "Triggering Coolify redeploy..."
          if [ -n "$COOLIFY_TOKEN" ]; then
            code=$(curl -fsS -o /tmp/coolify.out -w '%{http_code}' \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_WEBHOOK") || { echo "Coolify webhook failed"; cat /tmp/coolify.out; exit 1; }
          else
            code=$(curl -fsS -o /tmp/coolify.out -w '%{http_code}' "$COOLIFY_WEBHOOK") \
              || { echo "Coolify webhook failed"; cat /tmp/coolify.out; exit 1; }
          fi
          echo "Coolify responded HTTP $code"
          cat /tmp/coolify.out || true

      - name: Wait for rollout
        if: env.DEPLOY_API_URL != ''
        run: sleep "$DEPLOY_WAIT_SECONDS"

      - name: Verify deploy (health check)
        if: env.DEPLOY_API_URL != ''
        run: |
          chmod +x scripts/verify-deploy.sh
          for i in 1 2 3 4 5 6; do
            if ./scripts/verify-deploy.sh "$DEPLOY_API_URL"; then
              echo "Deploy verified."; exit 0
            fi
            echo "Health not ready yet (attempt $i) — retrying in 20s..."
            sleep 20
          done
          echo "Deploy verification failed after retries."
          exit 1

      - name: No deploy target configured
        if: env.COOLIFY_WEBHOOK == '' && env.DEPLOY_API_URL == ''
        run: |
          echo "No COOLIFY_WEBHOOK or DEPLOY_API_URL secret set — nothing to deploy."
          echo "Set repo secrets to enable auto-deploy (see docs/COOLIFY.md -> Auto-redeploy)."
          echo "Budget compose alternative: ./scripts/deploy-vps.sh (docs/BUDGET-DEPLOY.md)."

      - name: Railway note
        if: env.RAILWAY_TOKEN != ''
        run: echo "RAILWAY_TOKEN is set - add 'railway up' per service when ready."
