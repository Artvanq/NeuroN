name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuron_backend/neuron_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_backend/neuron_backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuron_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_frontend/package-lock.json
      - run: npm ci
      - run: npm run build
