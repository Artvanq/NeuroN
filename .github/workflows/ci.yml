name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuron_backend/neuron_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_backend/neuron_backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuron_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-load-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuron_backend/neuron_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:load

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: neuron_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neuron_frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
