services:
  redis:
    image: redis:7-alpine
    container_name: neuron-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: neuron-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: neuron
      POSTGRES_PASSWORD: neuron
      POSTGRES_DB: neuron
    volumes:
      - neuron_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuron -d neuron"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./neuron_backend/neuron_backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
      - "2222:2222"
    environment:
      PORT: 4000
      NODE_ENV: development
      SSH_GIT_PORT: 2222
      SSH_GIT_HOST: localhost
      DATABASE_URL: postgresql://neuron:neuron@postgres:5432/neuron
      JWT_SECRET: dev-only-change-in-production-min-32-chars-long
      FRONTEND_URL: http://localhost:3000
      SEED_DEMO: "true"
      REDIS_URL: redis://redis:6379
      MEDIA_STORAGE: disabled
      API_PUBLIC_URL: http://localhost:4000
      ACCESS_TOKEN_EXPIRES: 15m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-worker:
    build:
      context: ./neuron_backend/neuron_backend
      dockerfile: Dockerfile
    command: npm run worker:analytics
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://neuron:neuron@postgres:5432/neuron
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      CLICKHOUSE_TABLE: ${CLICKHOUSE_TABLE:-analytics_events}
      ANALYTICS_POLL_MS: 5000
      ANALYTICS_BATCH_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy

  digest-worker:
    build:
      context: ./neuron_backend/neuron_backend
      dockerfile: Dockerfile
    command: npm run worker:digest
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://neuron:neuron@postgres:5432/neuron
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Neuron <onboarding@yourdomain.com>}
      DIGEST_POLL_MS: 3600000
      DIGEST_HOURS: 24
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./neuron_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  neuron_pg_data:
